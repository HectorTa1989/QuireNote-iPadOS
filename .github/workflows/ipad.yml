name: iPad app
# Release signing retry after refreshing repository credentials.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select an available iPad simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if "iPad" in device["name"] and device["isAvailable"]:
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPad simulator found")')
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test on iPad Simulator
        # Simulator boot/test is not required for App Store distribution and can
        # exceed hosted-runner limits. Keep it available for manual runs without
        # blocking the signed release jobs.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests == true }}
        run: >-
          xcodebuild test
          -project Quire.xcodeproj
          -scheme Quire
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned device build
        run: >-
          xcodebuild archive
          -project Quire.xcodeproj
          -scheme Quire
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Quire.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned verification IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Quire.xcarchive/Products/Applications/Quire.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Quire-unsigned.ipa"
      - name: Upload unsigned verification IPA
        uses: actions/upload-artifact@v4
        with:
          name: Quire-unsigned-ipa
          path: ${{ runner.temp }}/Quire-unsigned.ipa
          if-no-files-found: error

  macos-build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive unsigned Mac Catalyst build
        run: >-
          xcodebuild archive
          -project Quire.xcodeproj
          -scheme Quire
          -configuration Release
          -destination 'generic/platform=macOS'
          -archivePath "$RUNNER_TEMP/Quire-macOS.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Upload Mac Catalyst archive
        uses: actions/upload-artifact@v4
        with:
          name: Quire-macOS-unsigned-archive
          path: ${{ runner.temp }}/Quire-macOS.xcarchive
          if-no-files-found: error

  signed-ipa:
    if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/quire.mobileprovision"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile-name.txt"
      - name: Archive signed release
        run: |
          xcodebuild archive \
            -project Quire.xcodeproj \
            -scheme Quire \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Quire.xcarchive"
      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat "$RUNNER_TEMP/profile-name.txt")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.quirenote.app</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Quire.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Quire-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
      - name: Upload to App Store Connect
        continue-on-error: true
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${APPSTORE_KEY_ID}.p8"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload App Store screenshots
        if: github.event_name == 'workflow_dispatch'
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/ios-screenshots/en-US"
          cp 'fastlane/screenshots/en-US/iPad Pro (13-inch) (M4)-01.png' "$RUNNER_TEMP/ios-screenshots/en-US/"
          cp 'fastlane/screenshots/en-US/iPhone 16 Pro-01.png' "$RUNNER_TEMP/ios-screenshots/en-US/"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "appstore_api_key.json"), "w") as f:
              json.dump({
                  "key_id": os.environ["APPSTORE_KEY_ID"],
                  "issuer_id": os.environ["APPSTORE_ISSUER_ID"],
                  "key": os.environ["APPSTORE_PRIVATE_KEY"],
                  "in_house": False,
              }, f)
          PY
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/appstore_api_key.json" \
            --app_identifier com.quirenote.app \
            --screenshots_path "$RUNNER_TEMP/ios-screenshots" \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_app_version_update true \
            --run_precheck_before_submit false \
            --force true

  signed-macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_MAC_APP_CERTIFICATE_BASE64_V2 }}
          MAC_APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAC_CERTIFICATE_PASSWORD_V3 }}
          PROFILE_BASE64: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE_BASE64 }}
          CATALYST_PROFILE_BASE64: ${{ secrets.APPLE_MAC_CATALYST_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/installer-certificate.p12"
          MAC_APP_CERTIFICATE_PATH="$RUNNER_TEMP/mac-app-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          CATALYST_PROFILE_PATH="$RUNNER_TEMP/catalyst-profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$INSTALLER_CERTIFICATE_PATH"
          echo -n "$MAC_APP_CERTIFICATE_BASE64" | base64 --decode > "$MAC_APP_CERTIFICATE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          echo -n "$CATALYST_PROFILE_BASE64" | base64 --decode > "$CATALYST_PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERTIFICATE_PATH" -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$MAC_APP_CERTIFICATE_PATH" -P "$MAC_APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/quire-macos.mobileprovision"
          cp "$CATALYST_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/quire-catalyst.mobileprovision"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          security cms -D -i "$CATALYST_PROFILE_PATH" > "$RUNNER_TEMP/catalyst-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile-name.txt"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/catalyst-profile.plist" > "$RUNNER_TEMP/catalyst-profile-name.txt"
          PROFILE_NAME=$(cat "$RUNNER_TEMP/profile-name.txt")
          sed -i '' "s|QuireNote App Store 2026|$PROFILE_NAME|" project.yml
          xcodegen generate
      - name: Archive signed Mac Catalyst release
        run: |
          xcodebuild archive \
            -project Quire.xcodeproj \
            -scheme Quire \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/Quire-macOS.xcarchive" \
            CODE_SIGN_IDENTITY='3rd Party Mac Developer Application' \
            CODE_SIGNING_STYLE=Manual
      - name: Export signed Mac package
        run: |
          APP_PATH="$RUNNER_TEMP/Quire-macOS.xcarchive/Products/Applications/Quire.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/mac-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/mac-entitlements.plist")" = true
          mkdir -p "$RUNNER_TEMP/mac-export"
          productbuild \
            --sign '3rd Party Mac Developer Installer' \
            --component "$APP_PATH" \
            /Applications \
            "$RUNNER_TEMP/mac-export/QuireNote-macOS.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/mac-export/QuireNote-macOS.pkg"
      - name: Upload signed Mac package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quire-signed-macOS
          path: ${{ runner.temp }}/mac-export/*.pkg
          if-no-files-found: error
      - name: Upload Mac build to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$KEY_DIRECTORY/AuthKey_${APPSTORE_KEY_ID}.p8"
          PKG_PATH=$(find "$RUNNER_TEMP/mac-export" -maxdepth 1 -name '*.pkg' -print -quit)
          xcrun altool --upload-app --type macos --file "$PKG_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
