name: iPad app

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select an available iPad simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if "iPad" in device["name"] and device["isAvailable"]:
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPad simulator found")')
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test on iPad Simulator
        # Simulator boot/test is not required for App Store distribution and can
        # exceed hosted-runner limits. Keep it available for manual runs without
        # blocking the signed release jobs.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests == true }}
        run: >-
          xcodebuild test
          -project Quire.xcodeproj
          -scheme Quire
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned device build
        run: >-
          xcodebuild archive
          -project Quire.xcodeproj
          -scheme Quire
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Quire.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned verification IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Quire.xcarchive/Products/Applications/Quire.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Quire-unsigned.ipa"
      - name: Upload unsigned verification IPA
        uses: actions/upload-artifact@v4
        with:
          name: Quire-unsigned-ipa
          path: ${{ runner.temp }}/Quire-unsigned.ipa
          if-no-files-found: error

  macos-build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive unsigned Mac Catalyst build
        run: >-
          xcodebuild archive
          -project Quire.xcodeproj
          -scheme Quire
          -configuration Release
          -destination 'generic/platform=macOS'
          -archivePath "$RUNNER_TEMP/Quire-macOS.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Upload Mac Catalyst archive
        uses: actions/upload-artifact@v4
        with:
          name: Quire-macOS-unsigned-archive
          path: ${{ runner.temp }}/Quire-macOS.xcarchive
          if-no-files-found: error

  signed-ipa:
    if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/quire.mobileprovision"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile-name.txt"
      - name: Archive signed release
        run: |
          xcodebuild archive \
            -project Quire.xcodeproj \
            -scheme Quire \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Quire.xcarchive"
      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat "$RUNNER_TEMP/profile-name.txt")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.quirenote.app</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Quire.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Quire-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
      - name: Upload to App Store Connect
        continue-on-error: true
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${APPSTORE_KEY_ID}.p8"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload App Store screenshots
        if: always()
        continue-on-error: true
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "appstore_api_key.json"), "w") as f:
              json.dump({
                  "key_id": os.environ["APPSTORE_KEY_ID"],
                  "issuer_id": os.environ["APPSTORE_ISSUER_ID"],
                  "key": os.environ["APPSTORE_PRIVATE_KEY"],
                  "in_house": False,
              }, f)
          PY
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/appstore_api_key.json" \
            --app_identifier com.quirenote.app \
            --screenshots_path fastlane/screenshots \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_app_version_update true \
            --run_precheck_before_submit false \
            --force true

  signed-macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install signing assets
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.provisionprofile"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          MAC_APP_KEY_PATH="$RUNNER_TEMP/mac-app-distribution.key"
          MAC_INSTALLER_KEY_PATH="$RUNNER_TEMP/mac-installer-distribution.key"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$API_KEY_PATH"
          openssl genrsa -out "$MAC_APP_KEY_PATH" 2048
          openssl genrsa -out "$MAC_INSTALLER_KEY_PATH" 2048
          make_jwt() {
            python3 - "$API_KEY_PATH" "$APPSTORE_KEY_ID" "$APPSTORE_ISSUER_ID" <<'PY'
          import base64, json, subprocess, sys, time
          def b64(data): return base64.urlsafe_b64encode(data).rstrip(b'=').decode()
          def read_len(data, p):
              n=data[p]; p+=1
              if n & 128:
                  k=n & 127; n=int.from_bytes(data[p:p+k], 'big'); p+=k
              return n,p
          def integer(data, p):
              assert data[p] == 2; n,p=read_len(data,p+1); return data[p:p+n],p+n
          def raw_sig(der):
              assert der[0] == 48; _,p=read_len(der,1); r,p=integer(der,p); s,p=integer(der,p)
              return r.lstrip(b'\0').rjust(32,b'\0') + s.lstrip(b'\0').rjust(32,b'\0')
          key, kid, issuer = sys.argv[1:]
          header=b64(json.dumps({'alg':'ES256','kid':kid,'typ':'JWT'},separators=(',',':')).encode())
          payload=b64(json.dumps({'iss':issuer,'iat':int(time.time()),'exp':int(time.time())+1100,'aud':'appstoreconnect-v1'},separators=(',',':')).encode())
          message=(header+'.'+payload).encode()
          der=subprocess.check_output(['openssl','dgst','-sha256','-sign',key],input=message)
          print(header+'.'+payload+'.'+b64(raw_sig(der)))
          PY
          }
          api_post() {
            curl --fail-with-body -sS -X POST "https://api.appstoreconnect.apple.com/v1/$1" \
              -H "Authorization: Bearer $(make_jwt)" -H 'Content-Type: application/json' --data-binary @"$2"
          }
          create_certificate() {
            local type="$1" prefix="$2" key_path="$3"
            openssl req -new -key "$key_path" -subj '/CN=QuireNote Mac Distribution/O=QuireNote/C=US' -out "$RUNNER_TEMP/$prefix.csr"
            python3 - "$type" "$RUNNER_TEMP/$prefix.csr" "$RUNNER_TEMP/$prefix.json" <<'PY'
          import base64,json,sys
          json.dump({'data':{'type':'certificates','attributes':{'certificateType':sys.argv[1],'csrContent':base64.b64encode(open(sys.argv[2],'rb').read()).decode()}}},open(sys.argv[3],'w'))
          PY
            api_post certificates "$RUNNER_TEMP/$prefix.json" > "$RUNNER_TEMP/$prefix.response.json"
            python3 - "$RUNNER_TEMP/$prefix.response.json" "$RUNNER_TEMP/$prefix.cer" <<'PY'
          import base64,json,sys
          d=json.load(open(sys.argv[1]))['data']; open(sys.argv[2],'wb').write(base64.b64decode(d['attributes']['certificateContent'])); print(d['id'])
          PY
          }
          MAC_APP_CERT_ID=$(create_certificate MAC_APP_DISTRIBUTION mac-app "$MAC_APP_KEY_PATH")
          create_certificate MAC_INSTALLER_DISTRIBUTION mac-installer "$MAC_INSTALLER_KEY_PATH" >/dev/null
          openssl x509 -inform DER -in "$RUNNER_TEMP/mac-app.cer" -out "$RUNNER_TEMP/mac-app.pem"
          openssl x509 -inform DER -in "$RUNNER_TEMP/mac-installer.cer" -out "$RUNNER_TEMP/mac-installer.pem"
          openssl pkcs12 -export -out "$APP_CERTIFICATE_PATH" -inkey "$MAC_APP_KEY_PATH" -in "$RUNNER_TEMP/mac-app.pem" -passout pass:"$CERTIFICATE_PASSWORD"
          openssl pkcs12 -export -out "$INSTALLER_CERTIFICATE_PATH" -inkey "$MAC_INSTALLER_KEY_PATH" -in "$RUNNER_TEMP/mac-installer.pem" -passout pass:"$CERTIFICATE_PASSWORD"
          BUNDLE_ID=$(curl --fail-with-body -sS --get 'https://api.appstoreconnect.apple.com/v1/bundleIds' -H "Authorization: Bearer $(make_jwt)" --data-urlencode 'filter[identifier]=com.quirenote.app' | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"][0]["id"])')
          python3 - "$BUNDLE_ID" "$MAC_APP_CERT_ID" "$RUNNER_TEMP/profile.request.json" <<'PY'
          import json,sys
          json.dump({'data':{'type':'profiles','attributes':{'name':'QuireNote Mac App Store CI','profileType':'MAC_APP_STORE'},'relationships':{'bundleId':{'data':{'type':'bundleIds','id':sys.argv[1]}},'certificates':{'data':[{'type':'certificates','id':sys.argv[2]}]}}}},open(sys.argv[3],'w'))
          PY
          api_post profiles "$RUNNER_TEMP/profile.request.json" > "$RUNNER_TEMP/profile.response.json"
          python3 - "$RUNNER_TEMP/profile.response.json" "$PROFILE_PATH" <<'PY'
          import base64,json,sys
          open(sys.argv[2],'wb').write(base64.b64decode(json.load(open(sys.argv[1]))['data']['attributes']['profileContent']))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/quire-macos.provisionprofile"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile-name.txt"
      - name: Archive signed Mac Catalyst release
        run: |
          xcodebuild archive \
            -project Quire.xcodeproj \
            -scheme Quire \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Quire-macOS.xcarchive" \
            CODE_SIGN_IDENTITY='Mac App Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$(cat "$RUNNER_TEMP/profile-name.txt")"
      - name: Export signed Mac package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat "$RUNNER_TEMP/profile-name.txt")
          cat > "$RUNNER_TEMP/MacExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.quirenote.app</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Quire-macOS.xcarchive" -exportPath "$RUNNER_TEMP/mac-export" -exportOptionsPlist "$RUNNER_TEMP/MacExportOptions.plist"
      - name: Upload signed Mac package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quire-signed-macOS
          path: ${{ runner.temp }}/mac-export/*.pkg
          if-no-files-found: error
      - name: Upload Mac build to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$KEY_DIRECTORY/AuthKey_${APPSTORE_KEY_ID}.p8"
          PKG_PATH=$(find "$RUNNER_TEMP/mac-export" -maxdepth 1 -name '*.pkg' -print -quit)
          xcrun altool --upload-app --type macos --file "$PKG_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
