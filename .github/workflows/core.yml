name: QuireCore

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          # 6.1.2 is the current Windows-hosted Swift 6 release supported by
          # setup-swift. QuireCore declares Swift tools 6.0 compatibility.
          swift-version: "6.1.2"
      - name: Build and test QuireCore
        shell: pwsh
        run: ./scripts/test-windows.ps1

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and test QuireCore
        run: swift test
