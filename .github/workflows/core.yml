name: QuireCore

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4"
      - name: Build and test QuireCore
        shell: pwsh
        run: ./scripts/test-windows.ps1

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and test QuireCore
        run: swift test
